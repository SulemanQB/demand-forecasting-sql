[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "demandforecast"
version = "1.0.0"
description = "SQL feature engineering and backtested retail demand forecasting"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Suleman Qamar" }]
dependencies = [
    "duckdb==1.5.6",
    "lightgbm==4.7.0",
    "matplotlib==3.11.2",
    "numpy==2.5.3",
    "pandas==3.0.6",
    "pyarrow==26.0.0",
    "python-calamine==0.8.3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
demandforecast = "demandforecast.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
